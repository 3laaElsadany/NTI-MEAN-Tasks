<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task NTI , Day 2</title>
  </head>
  <body>
    <p id="result"></p>
    <script>
      // ===========================
      // File 1
      // ===========================

      // Different Data Types
      var myString = "Hello JavaScript";
      var myNumber = 25;
      var myBoolean = true;
      var myNull = null;
      var myUndefined;

      // Print values
      console.log("String:", myString);
      console.log("Number:", myNumber);
      console.log("Boolean:", myBoolean);
      console.log("Null:", myNull);
      console.log("Undefined:", myUndefined);

      // Print data types
      console.log("Type of myString:", typeof myString);
      console.log("Type of myNumber:", typeof myNumber);
      console.log("Type of myBoolean:", typeof myBoolean);
      console.log("Type of myNull:", typeof myNull); // object (JavaScript behavior)
      console.log("Type of myUndefined:", typeof myUndefined);

      // Concatenation
      var firstName = "Alaa";
      var lastName = "Elsadany";

      // Old way
      var fullName1 = firstName + " " + lastName;
      console.log("Old Way:", fullName1);

      // Template Literal
      var fullName2 = `${firstName} ${lastName}`;
      console.log("Template Literal:", fullName2);

      // ===========================

      var username = "Alaa";
      var password = "12345678";

      if (username === "") {
        alert("Username is required");
      }

      if (password.length < 8) {
        alert("Password must be at least 8 characters");
      }

      if (username !== "" && password.length >= 8) {
        console.log("Username:", username);
        console.log("Password:", password);
      }

      // ===========================
      // File 2
      // ===========================

      var employeeName = prompt("Enter Employee Name:");
      var age = Number(prompt("Enter Employee Age:"));
      var experience = Number(prompt("Enter Years of Experience:"));
      var rating = Number(prompt("Enter Self Rating (1 - 10):"));
      var baseSalary = Number(prompt("Enter Base Salary:"));

      // =========================
      // 2. Job Category
      // =========================

      var jobCategory;

      if (experience < 2) {
        jobCategory = "Junior";
      } else if (experience <= 5) {
        jobCategory = "Mid-Level";
      } else if (experience <= 10) {
        jobCategory = "Senior";
      } else {
        jobCategory = "Expert";
      }

      // =========================
      // 3. Performance Rating
      // =========================

      var performance;

      if (rating >= 9) {
        performance = "Excellent";
      } else if (rating >= 7) {
        performance = "Good";
      } else if (rating >= 5) {
        performance = "Average";
      } else {
        performance = "Needs Improvement";
      }

      // =========================
      // 4. Salary Calculation
      // =========================

      var bonusPercentage;

      if (experience <= 2) {
        bonusPercentage = 0.1;
      } else if (experience <= 5) {
        bonusPercentage = 0.15;
      } else {
        bonusPercentage = 0.2;
      }

      var bonus = baseSalary * bonusPercentage;
      var finalSalary = baseSalary + bonus;

      // =========================
      // 5. Work Shift
      // =========================

      var currentHour = new Date().getHours();

      var shift;

      if (currentHour >= 9 && currentHour < 18) {
        shift = "Day Shift";
      } else {
        shift = "Night Shift";
      }

      // =========================
      // 6. Report
      // =========================

      var report = `
            Employee Name : ${employeeName}
            Age           : ${age}
            Experience    : ${experience} Years
            Job Category  : ${jobCategory}
            Performance   : ${performance}
            Base Salary   : ${baseSalary}
            Bonus         : ${bonus}
            Final Salary  : ${finalSalary}
            Shift         : ${shift}
        `;

      // Console
      console.log(report);

      // Alert
      alert(report);

      // DOM
      document.getElementById("result").innerHTML = `
            <h3>Employee Report</h3>
            <p><strong>Name:</strong> ${employeeName}</p>
            <p><strong>Age:</strong> ${age}</p>
            <p><strong>Experience:</strong> ${experience} Years</p>
            <p><strong>Job Category:</strong> ${jobCategory}</p>
            <p><strong>Performance:</strong> ${performance}</p>
            <p><strong>Base Salary:</strong> ${baseSalary}</p>
            <p><strong>Bonus:</strong> ${bonus}</p>
            <p><strong>Final Salary:</strong> ${finalSalary}</p>
            <p><strong>Shift:</strong> ${shift}</p>
        `;

      // ===========================
      // File 3
      // ===========================

      // 1
      for (let i = 1; i <= 10; i++) {
        console.log(i);
      }

      // 2
      for (let i = 2; i <= 20; i += 2) {
        console.log(i);
      }

      // 3
      var totalSales = 0;
      for (let i = 1; i <= 15; i++) {
        totalSales += i;
      }
      console.log("Total sales = " + totalSales);

      // 4
      var ticket = 1;
      while (ticket <= 7) {
        console.log(ticket);
        ticket++;
      }

      // 5
      var countdown = 8;
      while (countdown >= 1) {
        console.log(countdown);
        countdown--;
      }

      // 6
      var number = 1;
      do {
        console.log(number);
        number++;
      } while (number <= 5);

      // 7
      var itemsInCart = 10;
      console.log("Using while");
      while (itemsInCart < 5) {
        console.log("Start Shopping");
        itemsInCart++;
      }
      // while Loop check condition first, if false it will not run the loop body.

      console.log("Using do...while");
      do {
        console.log("Start Shopping");
        itemsInCart++;
      } while (itemsInCart < 5);
      // do...while Loop will run the loop body at least once, then check the condition

      // 8
      var userName = "Ali";
      var userAge = 22;
      var isStudent = true;

      console.log(userName);
      console.log(userAge);
      console.log(isStudent);

      console.log(typeof userName);
      console.log(typeof userAge);
      console.log(typeof isStudent);

      // 9
      var dbPrice = 10;
      var inputPrice = "10";

      console.log(dbPrice == inputPrice);
      console.log(dbPrice === inputPrice);

      // == compares only the value, while === compares both value and data type.

      // 10
      var userName1 = prompt("Enter your name:");
      var message = `Welcome, ${userName1}`;
      alert(message);
      console.log(message);

      // 11
      var quantity = prompt("Enter Quantity:");
      var num1 = Number(quantity);
      var num2 = parseInt(quantity);
      var num3 = +quantity;

      console.log(num1);
      console.log(typeof num1);
      console.log(num2);
      console.log(typeof num2);
      console.log(num3);
      console.log(typeof num3);

      // 12
      var a = 10;
      var b = 3;

      console.log("Addition = ", a + b);
      console.log("Subtraction = ", a - b);
      console.log("Multiplication = ", a * b);
      console.log("Division = ", a / b);
      console.log("Remainder = ", a % b);
      console.log("Power = ", a ** b);

      // 13
      var age = Number(prompt("Enter your age"));

      if (age >= 18) {
        console.log("You can enter");
      } else {
        console.log("Sorry, underage");
      }

      // 14
      var grade = Number(prompt("Enter your grade"));

      if (grade >= 90) {
        console.log("A");
      } else if (grade >= 80) {
        console.log("B");
      } else if (grade >= 70) {
        console.log("C");
      } else {
        console.log("F");
      }

      // 15
      var age = Number(prompt("Enter your age"));
      var result = age >= 18 ? "Adult" : "Minor";
      console.log(result);

      // 16
      var day = prompt("Enter day");

      switch (day) {
        case "Monday":
          console.log("Start your work week");
          break;

        case "Friday":
          console.log("Weekend is coming");
          break;

        case "Saturday":
        case "Sunday":
          console.log("Weekend");
          break;

        default:
          console.log("Normal Workday");
      }

      // 17
      var price = Number(prompt("Enter product price"));
      for (var i = 1; i <= 10; i++) {
        console.log(`${i} x ${price} = ${i * price}`);
      }

      // 18
      var fileSize = Number(prompt("Enter file size"));

      if (fileSize > 0) {
        for (let i = 1; i <= fileSize; i++) {
          console.log(i);
        }
      } else {
        console.log("Invalid file size");
      }

      // 19
      var start = Number(prompt("Enter start number"));
      var end = Number(prompt("Enter end number"));

      for (let i = start; i <= end; i++) {
        if (i % 2 === 0) {
          console.log(i + " -> Express");
        } else {
          console.log(i + " -> Normal");
        }
      }

      // 20
      var students = ["Ahmed", "Sara", "Ali", "Omar", "Mona"];
      for (let i = 0; i < students.length; i++) {
        console.log(`Student ${i + 1}: ${students[i]}`);
      }

      // 21
      var total = 0;
      for (let i = 1; i <= 5; i++) {
        var expense = Number(prompt(`Enter expense for day ${i}`));
        total += expense;
      }
      var average = total / 5;
      console.log("Total = " + total);
      console.log("Average = " + average);

      // 22
      var correctPin = "1234";
      var attempts = 0;
      var pin;
      while (attempts < 3) {
        pin = prompt("Enter PIN");

        if (pin === correctPin) {
          console.log("Login Successful");
          break;
        }

        attempts++;

        if (attempts === 3) {
          console.log("Login Failed");
        }
      }

      // 23
      var hasAccount = true;
      var isVerified = false;

      if (hasAccount && isVerified) {
        console.log("Welcome back");
      } else if (hasAccount && !isVerified) {
        console.log("Please verify your account");
      } else {
        console.log("Please sign up");
      }

      // 24
      var a = 40;
      var b = 50;
      var c = Number("60");
      var d = 30;
      var e = 30;
      var total = a + b + c + d + e;
      console.log(total);
      if (total <= 20) {
        for (let i = 1; i <= total; i++) {
          console.log(i);
        }
      } else {
        console.log("Too big to print line by line");
      }

      // 25
      var n = Number(prompt("Enter a number"));
      if (n < 0) {
        alert("Invalid Number");
      } else {
        var factorial = 1;

        for (let i = 1; i <= n; i++) {
          factorial *= i;
        }

        alert(`${n}! = ${factorial}`);
        console.log(`${n}! = ${factorial}`);
      }
    </script>
  </body>
</html>
